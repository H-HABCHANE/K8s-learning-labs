apiVersion: apps/v1        # les Deployments sont dans le groupe "apps"
kind: Deployment           # le type d'objet
metadata:
  name: boutique            # le nom du Deployment
spec:
  replicas: 3            # je veux TOUJOURS 3 Pods
  selector:
    matchLabels:
      app: boutique         # "les Pods qui m'appartiennent sont ceux qui ont l'étiquette app=boutique"
  template:                # le modèle (la recette) pour fabriquer chaque Pod
    metadata:
      labels:
        app: boutique       # l'étiquette collée sur chaque Pod fabriqué
    spec:
      containers:
        - name: boutique
          image: httpd:2.4
          ports:
            - containerPort: 80
