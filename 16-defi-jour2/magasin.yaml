apiVersion: v1
kind: ConfigMap
metadata:
  name: magasin-config
data:
  APP_ENV: "production"
  APP_COULEUR: "bleu"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magasin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: magasin
  template:
    metadata:
      labels:
        app: magasin
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: magasin-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: magasin-secret
                  key: API_KEY
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: magasin-svc
spec:
  type: NodePort
  selector:
    app: magasin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30100
