apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  labels:
    app: debug
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
      command: ["sh", "-c", "echo Utilisateur=$DB_USER, mot de passe de ${#DB_PASSWORD} caracteres; sleep 3600"]
