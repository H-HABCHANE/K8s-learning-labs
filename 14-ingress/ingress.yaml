apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mon-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: vitrine.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vitrine-svc
            port:
              number: 80
  - host: boutique.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: boutique-svc
            port:
              number: 80
