apiVersion: v1
kind: Pod
metadata:
  name: avec-pvc            # Nom du Pod
spec:
  volumes:                  # Déclaration du volume au niveau du Pod
  - name: stockage-data     # Nom logique interne au Pod
    persistentVolumeClaim:
      claimName: data-pvc   # Lien vers le nom du PVC créé précédemment
  containers:
  - name: mon-conteneur
    image: busybox:1.36     # Image Docker à utiliser
    command: ["sh", "-c", "sleep 3600"] # Maintien en exécution
    volumeMounts:           # Montage du volume au niveau du conteneur
    - name: stockage-data   # Doit correspondre exactement au nom défini dans 'volumes'
      mountPath: /data      # Chemin de destination dans le conteneur
